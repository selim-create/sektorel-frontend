name: Temp homepage and agenda UI fix

on:
  push:
    branches:
      - fix/home-sectors-agenda-list-default

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-sectors-agenda-list-default
          fetch-depth: 0
      - name: Patch homepage sectors and agenda default view
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/page.tsx')
          s = p.read_text()
          old = """  const sectors = sectorData?.sectors?.nodes || [];\n  const companies = companyData?.companies?.nodes || [];\n  const events = eventData?.events?.nodes || [];\n"""
          new = """  const sectors = sectorData?.sectors?.nodes || [];\n  const homepageSectors = [...sectors]\n    .map((sector) => ({ sector, sortKey: Math.random() }))\n    .sort((left, right) => left.sortKey - right.sortKey)\n    .slice(0, 10)\n    .map(({ sector }) => sector);\n  const companies = companyData?.companies?.nodes || [];\n  const events = eventData?.events?.nodes || [];\n"""
          assert s.count(old) == 1, ('homepage data block', s.count(old))
          s = s.replace(old, new)
          assert s.count('{sectors.map((sector: any) => {') == 1
          s = s.replace('{sectors.map((sector: any) => {', '{homepageSectors.map((sector: any) => {')
          p.write_text(s)

          p = Path('app/ajanda/page.tsx')
          s = p.read_text()
          old = '  const view = viewParam === "list" ? "list" : "calendar";'
          new = '  const view = viewParam === "calendar" ? "calendar" : "list";'
          assert s.count(old) == 1, ('agenda default view', s.count(old))
          s = s.replace(old, new)
          old = '    ...(view === "list" ? { view } : {}),'
          new = '    ...(view === "calendar" ? { view } : {}),'
          assert s.count(old) == 1, ('agenda base params', s.count(old))
          s = s.replace(old, new)
          old = '              hasViewParam={Boolean(viewParam)}\n'
          assert s.count(old) == 1, ('hasViewParam usage', s.count(old))
          s = s.replace(old, '')
          p.write_text(s)

          p = Path('components/agenda/EventFilters.tsx')
          s = p.read_text()
          s = s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useMemo, useState } from "react";')
          s = s.replace('  hasViewParam: boolean;\n', '')
          s = s.replace('  hasViewParam,\n', '')
          s = s.replace('\nconst VIEW_STORAGE_KEY = "agenda-view-preference";\n', '\n')
          block = """  useEffect(() => {\n    if (hasViewParam) {\n      window.localStorage.setItem(VIEW_STORAGE_KEY, currentFilters.view);\n      return;\n    }\n\n    const storedView = window.localStorage.getItem(VIEW_STORAGE_KEY);\n    if (storedView && storedView !== currentFilters.view) {\n      const params = new URLSearchParams(window.location.search);\n      params.set(\"view\", storedView);\n      router.replace(`${pathname}?${params.toString()}`);\n    }\n  }, [currentFilters.view, hasViewParam, pathname, router]);\n\n"""
          assert s.count(block) == 1, ('view preference effect', s.count(block))
          s = s.replace(block, '')
          old = '    if (nextView && nextView !== "calendar") params.set("view", nextView);'
          new = '    if (nextView && nextView !== "list") params.set("view", nextView);'
          assert s.count(old) == 1, ('submit default view', s.count(old))
          s = s.replace(old, new)
          old = '    if (view !== "calendar") params.set("view", view);'
          new = '    if (view !== "list") params.set("view", view);'
          assert s.count(old) == 1, ('reset default view', s.count(old))
          s = s.replace(old, new)
          old = """  const setNextView = (nextView: string) => {\n    setView(nextView);\n    window.localStorage.setItem(VIEW_STORAGE_KEY, nextView);\n    submitFilters(nextView);\n  };\n"""
          new = """  const setNextView = (nextView: string) => {\n    setView(nextView);\n    submitFilters(nextView);\n  };\n"""
          assert s.count(old) == 1, ('setNextView', s.count(old))
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F 'homepageSectors.map' app/page.tsx
          grep -F 'viewParam === "calendar" ? "calendar" : "list"' app/ajanda/page.tsx
          grep -F 'nextView !== "list"' components/agenda/EventFilters.tsx
          npm ci
          npm run lint
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/ajanda/page.tsx components/agenda/EventFilters.tsx
          git commit -m 'Show ten random sectors and default agenda to list view'
          git push origin HEAD:fix/home-sectors-agenda-list-default
