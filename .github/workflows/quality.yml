name: Frontend Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint report, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint baseline report
        continue-on-error: true
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_WORDPRESS_API_URL: https://api.sektorelajanda.com/graphql
        run: npm run build
